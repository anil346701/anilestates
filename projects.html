<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Anil Estates</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .projects-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .project-card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: #fff;
    }
    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    .price-tag {
      font-weight: bold;
      color: #2e7d32;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
    </nav>
  </header>

  <main>
    <h1 style="text-align: center; margin-top: 30px;">Our Projects</h1>
    <div id="projects-container" class="projects-container">
      <p style="text-align: center;">Loading projects...</p>
    </div>
  </main>

  <script>
    // Paste your Stein API URL inside the quotes below
    const API_URL = "YOUR_STEINS_API_URL_HERE";

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("projects-container");
        container.innerHTML = "";

        data.forEach(project => {
          const card = document.createElement("div");
          card.className = "project-card";
          card.innerHTML = `
            <img src="${project.image}" alt="${project.title}">
            <h3>${project.title}</h3>
            <p><strong>Location:</strong> ${project.location}</p>
            <p><strong>Type:</strong> ${project.bhk}</p>
            <p class="price-tag"><strong>Price:</strong> ${project.price}</p>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => console.error("Error loading data:", err));
  </script>

</body>
</html>
